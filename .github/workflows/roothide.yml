name: "*** build tipa file - 2026 Fix ***"

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          
      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Fix Procursus Permissions (Theo AI gợi ý)
        run: |
          # Cấp quyền sở hữu thư mục để gtar không bị Permission denied
          sudo chown -R $(id -u):$(id -g) /opt/procursus
          sudo chmod -R 755 /opt/procursus

      - name: Install THEOS
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          mkdir -p $THEOS
          curl -fsSL https://githubusercontent.com >> install-theos.sh
          chmod +x install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          gunzip $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar -C $THEOS/sdks

      - name: Build and Install trustcache
        run: |
          git clone https://github.com
          cd trustcache
          export CFLAGS="$CFLAGS -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j$(sysctl -n hw.physicalcpu) OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Stealth Mode (Chỉ đổi tên - Giữ nguyên Bundle ID)
        run: |
          # Chỉ sửa tên hiển thị để tránh lỗi Exploit Kernel (Dòng 2)
          find . -name "Info.plist" -type f | while read plist; do
            plutil -replace CFBundleDisplayName -string "System Health" "$plist" 2>/dev/null || true
            plutil -replace CFBundleName -string "System Health" "$plist" 2>/dev/null || true
          done

      - name: Build
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          sudo rm -rf $(xcrun --sdk iphoneos --show-sdk-path)/usr/include/xpc
          gmake -j$(sysctl -n hw.physicalcpu)
          VERSION=$(cat ./BaseBin/_external/basebin/.version)-$(git rev-parse --short HEAD)
          mv ./Application/Dopamine.tipa "./Application/Dopamine-Roothide-Fixed.tipa"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-Build
          path: ./Application/Dopamine-Roothide-Fixed.tipa

